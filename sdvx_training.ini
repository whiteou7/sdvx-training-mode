; Key values are Windows virtual-key codes (decimal or 0x hex), 0 = no key.

[keys]
overlay=0xC0    ; `                   open / close the on-screen control panel
toggle=0        ; e.g. 0x2D Insert    training mode on/off
set_start=0     ; e.g. 0x24 Home      set start measure
set_end=0       ; e.g. 0x23 End       set end measure
jump_start=0    ; e.g. 0x21 Page Up   jump to start measure
repeat=0        ; e.g. 0x22 Page Down loop repeat on/off
prev=0          ; e.g. 0x25 Left      seek one measure back
next=0          ; e.g. 0x27 Right     seek one measure forward
clear=0         ; e.g. 0x2E Delete    reset the loop to the whole chart
speed_up=0      ; e.g. 0x26 Up        playback speed + speed_mod_step (up to speed_mod_max)
speed_down=0    ; e.g. 0x28 Down      playback speed - speed_mod_step (down to speed_mod_min)
pause=0         ; e.g. 0x13 Pause     pause / resume the chart
scale_windows=0 ;                     timing windows scale with the speed modifier on/off
fixed_scroll=0  ;                     fixed scroll speed on/off
no_camera=0     ;                     camera and lane events (tilt, spin, zoom, lane split/hide) off/on

[training]
enabled_on_start=0    ; 1 = training mode already on when a chart starts
preroll_measures=1    ; playback resumes this many measures before the loop start
speed_mod_step=0.05   
speed_mod_min=0.5     
speed_mod_max=2.0     
